services:
  - type: web
    name: reee-track-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: reee-track-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_EMAIL
        value: admin@reee-track.local
      - key: INITIAL_ADMIN_FULL_NAME
        value: Administrador do sistema
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: "[]"
      - key: PUBLIC_FRONTEND_URL
        fromService:
          type: web
          name: reee-track-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: reee-track-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: reee-track-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: reee-track-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: reee_track
    user: reee_track
    ipAllowList: []
